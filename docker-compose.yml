services:
  postgres:
    image: postgres:16
    container_name: vtys-postgres
    environment:
      POSTGRES_USER: vtys
      POSTGRES_PASSWORD: vtys2026
      POSTGRES_DB: vtysdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./veri:/veri

  pgadmin:
    image: dpage/pgadmin4
    container_name: vtys-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ogrenci@firat.edu.tr
      PGADMIN_DEFAULT_PASSWORD: vtys2026
    ports:
      - "5050:80"

volumes:
  pgdata:
